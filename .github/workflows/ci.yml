name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install test tools
        run: python -m pip install pytest huggingface-hub tqdm ruff mypy
      - name: Python tests
        run: PYTHONPATH=. python -m pytest -q
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: shellcheck start_runpod.sh install_runpod.sh generate_env.sh
